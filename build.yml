name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
      - run: npm install --legacy-peer-deps
      - run: npx cap add android
      - name: Add screenshot protection and harden the app
        run: |
          D=android/app/src/main/java/com/hamada/physics
          mkdir -p "$D"
          cat > "$D/SecurePlugin.java" <<'EOF'
          package com.hamada.physics;

          import android.content.Intent;
          import android.speech.tts.TextToSpeech;
          import android.view.WindowManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.Locale;

          @CapacitorPlugin(name = "Secure")
          public class SecurePlugin extends Plugin {

              @PluginMethod
              public void set(final PluginCall call) {
                  final boolean on = call.getBoolean("on", true);
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (on) {
                              getActivity().getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                          } else {
                              getActivity().getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                          }
                          call.resolve();
                      }
                  });
              }

              @PluginMethod
              public void exitApp(final PluginCall call) {
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          getActivity().finishAffinity();
                      }
                  });
                  call.resolve();
              }
              @PluginMethod
              public void ensureVoice(final PluginCall call) {
                  final TextToSpeech[] holder = new TextToSpeech[1];
                  holder[0] = new TextToSpeech(getContext(), new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          JSObject res = new JSObject();
                          boolean ok = false;
                          boolean opened = false;
                          try {
                              if (status == TextToSpeech.SUCCESS && holder[0] != null) {
                                  int r = holder[0].isLanguageAvailable(new Locale("ar"));
                                  ok = r >= TextToSpeech.LANG_AVAILABLE;
                                  if (!ok) {
                                      try {
                                          Intent i = new Intent(TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA);
                                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                          getActivity().startActivity(i);
                                          opened = true;
                                      } catch (Exception e) {
                                          opened = false;
                                      }
                                  }
                              }
                          } catch (Exception e) {
                              ok = false;
                          }
                          try {
                              if (holder[0] != null) {
                                  holder[0].shutdown();
                              }
                          } catch (Exception e) {
                          }
                          res.put("ok", ok);
                          res.put("opened", opened);
                          call.resolve(res);
                      }
                  });
              }
          }
          EOF
          cat > "$D/MainActivity.java" <<'EOF'
          package com.hamada.physics;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SecurePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Apply app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import os,shutil
          src=Image.open('icon.png').convert('RGBA')
          res='android/app/src/main/res'
          shutil.rmtree(res+'/mipmap-anydpi-v26',ignore_errors=True)
          for d in ['mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi']: os.makedirs(f'{res}/mipmap-{d}',exist_ok=True)
          for d,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              im=src.resize((s,s),Image.LANCZOS)
              im.save(f'{res}/mipmap-{d}/ic_launcher.png')
              r=Image.new('RGBA',(s,s),(0,0,0,0))
              m=Image.new('L',(s,s),0);ImageDraw.Draw(m).ellipse((0,0,s-1,s-1),fill=255)
              bg=Image.new('RGBA',(s,s),(10,42,122,255));r.paste(bg,(0,0),m)
              k=int(s*.74);sm=src.resize((k,k),Image.LANCZOS);o=(s-k)//2
              r.alpha_composite(sm,(o,o));r.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "حمادة للفيزياء.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hamada-physics
          path: "حمادة للفيزياء.apk"
